apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: alice
  namespace: argocd
spec:
  description: "Tenant: alice — locked to their own repo and namespace"
  sourceRepos:
    - "http://gitea.cluster.local:3000/alice/*"
  destinations:
    - namespace: alice
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: networking.k8s.io
      kind: NetworkPolicy
