apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alice
  namespace: argocd
spec:
  project: alice
  source:
    repoURL: "http://gitea.cluster.local:3000/alice/app.git"
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: alice
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
