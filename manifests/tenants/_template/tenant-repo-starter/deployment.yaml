# ============================================================
# You should only ever need to change ONE line in this file:
# the `image:` line below, after you build and push your own
# container image. Everything else is already set up for you.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          # <-- CHANGE THIS to your own image, after pushing it to your
          # Gitea registry namespace (gitea.cluster.local:3000/alice/...)
          image: gitea.cluster.local:3000/alice/my-app:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
