---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ansible-runner
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ansible-runner
  namespace: kube-system
rules:
  # FIX: Added 'list' so the python watch.Watch() stream engine can bind to the resource
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["worker-registry"] # Safe lockdown constraint
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["k3s-join-token"] # Safe lockdown constraint
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ansible-runner
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: ansible-runner
    namespace: kube-system
roleRef:
  kind: Role
  name: ansible-runner
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ansible-runner-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"] # Perfectly correct for finding the control-plane InternalIP

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ansible-runner-nodes
subjects:
  - kind: ServiceAccount
    name: ansible-runner
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: ansible-runner-nodes
  apiGroup: rbac.authorization.k8s.io
