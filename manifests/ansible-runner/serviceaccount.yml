---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ansible-runner
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ansible-runner
  namespace: kube-system
rules:
  # Split deliberately — do not merge. RBAC only applies resourceNames to
  # requests that name a resource; list/watch don't, so pinning them here 403s.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["worker-registry"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["k3s-join-token"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ansible-runner
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: ansible-runner
    namespace: kube-system
roleRef:
  kind: Role
  name: ansible-runner
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ansible-runner-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"] # Perfectly correct for finding the control-plane InternalIP

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ansible-runner-nodes
subjects:
  - kind: ServiceAccount
    name: ansible-runner
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: ansible-runner-nodes
  apiGroup: rbac.authorization.k8s.io

---
# NEW tonight. Split into its own ClusterRole rather than folded into
# ansible-runner-nodes above, matching this file's own existing "split
# deliberately, do not merge" convention. Needs to be cluster-scoped (not a
# namespaced Role in kube-system) because the resource it targets —
# gitea-http — lives in the gitea namespace, not this one; resourceNames
# restricts by name only, not namespace, so this grants get on exactly one
# real object in practice. What it's for: provision() now looks up Gitea's
# ClusterIP itself (see custom_images/ansible-runner/ansible-runner.py) to
# write registries.yaml on self-joined nodes, the same config
# roles/configure_registry writes for the static server-1/2/3 inventory —
# self-joined nodes never run that role, since it only ever targets the
# static `hosts: server` group.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ansible-runner-gitea-lookup
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["gitea-http"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ansible-runner-gitea-lookup
subjects:
  - kind: ServiceAccount
    name: ansible-runner
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: ansible-runner-gitea-lookup
  apiGroup: rbac.authorization.k8s.io
