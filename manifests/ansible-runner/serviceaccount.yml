---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ansible-runner
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ansible-runner
  namespace: kube-system
rules:
  # Split deliberately — do not merge. RBAC only applies resourceNames to
  # requests that name a resource; list/watch don't, so pinning them here 403s.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["worker-registry"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["k3s-join-token"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ansible-runner
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: ansible-runner
    namespace: kube-system
roleRef:
  kind: Role
  name: ansible-runner
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ansible-runner-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"] # Perfectly correct for finding the control-plane InternalIP

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ansible-runner-nodes
subjects:
  - kind: ServiceAccount
    name: ansible-runner
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: ansible-runner-nodes
  apiGroup: rbac.authorization.k8s.io
