# registryPuller.username/password have no default in values.yaml on
# purpose — required below means this chart refuses to render at all if an
# app's Application doesn't set them via helm.parameters, rather than
# silently deploying a pod with no way to pull its image. Same account for
# every app (registry-puller, created once by bootstrap_gitops); never
# committed to any git repo, always supplied at Application-creation time.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.appName }}-pull
  namespace: {{ .Values.appName }}
type: kubernetes.io/dockerconfigjson
stringData:
  {{- $rp := .Values.registryPuller | default dict }}
  .dockerconfigjson: |
    {
      "auths": {
        "gitea.cluster.local:3000": {
          "username": "{{ required "registryPuller.username must be set on this Application" $rp.username }}",
          "password": "{{ required "registryPuller.password must be set on this Application" $rp.password }}",
          "auth": "{{ printf "%s:%s" $rp.username $rp.password | b64enc }}"
        }
      }
    }
