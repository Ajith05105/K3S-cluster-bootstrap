---
# No RBAC bindings at all, deliberately. gitea-runner talks to Gitea over
# plain HTTP (registration + job polling) and to nothing else — it has no
# legitimate reason to ever call the Kubernetes API. A tenant's Dockerfile
# runs as a build step on this pod (see deployment.yml's threat-model note),
# so the least this ServiceAccount can be handed, the better: this one gets
# zero Roles and doesn't even get its own token mounted (see
# automountServiceAccountToken below and on the pod spec).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-runner
  namespace: kube-system
automountServiceAccountToken: false
