apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dnsmasq
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://{{ gitea_cluster_ip.stdout }}:3000/admin/cluster-config.git
    targetRevision: HEAD
    path: dnsmasq
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
