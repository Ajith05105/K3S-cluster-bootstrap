---
- name: Discover nodes on the network
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait for Pis to boot
      pause:
        prompt: "Boot your Pis and type Enter when ready..."

    - name: Run node discovery
      command: python3 scripts/discovery.py
      args:
        chdir: "{{ playbook_dir }}/.."
      become: true

    - meta: refresh_inventory
