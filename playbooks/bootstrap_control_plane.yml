---
# k3s binary/install script/airgap bundle are staged to /tmp by
# playbooks/preflight.yml (idempotent, stat-gated) — run that first. This
# playbook no longer downloads them itself, to avoid two divergent copies of
# the same download logic.

- name: Copy binaries to server nodes
  hosts: server
  become: true
  roles:
    - copy_binaries

- name: Install k3s server
  hosts: server
  become: true
  serial: 1
  vars:
    k3s_cluster_init: "{{ inventory_hostname == groups['server'][0] }}"
    k3s_server_url: "{{ hostvars[groups['server'][0]]['ansible_host'] }}"
  roles:
    - k3s_server

- name: Copy and import kube-vip image on all server nodes
  hosts: server
  become: true
  tasks:
    - name: Copy kube-vip image tar to server
      ansible.builtin.copy:
        src: /tmp/k3s-images/kube-vip.tar
        dest: "/home/{{ ansible_user }}/kube-vip.tar"
        mode: '0644'

    - name: Import kube-vip image into containerd
      ansible.builtin.command: >
        k3s ctr images import /home/{{ ansible_user }}/kube-vip.tar

    - name: Copy kube-vip-cloud-provider image tar to server
      ansible.builtin.copy:
        src: /tmp/k3s-images/kube-vip-cloud-provider.tar
        dest: "/home/{{ ansible_user }}/kube-vip-cloud-provider.tar"
        mode: '0644'

    - name: Import kube-vip-cloud-provider image into containerd
      ansible.builtin.command: >
        k3s ctr --namespace k8s.io images import /home/{{ ansible_user }}/kube-vip-cloud-provider.tar

- name: Deploy kube-vip
  hosts: server
  become: true
  run_once: true
  roles:
    - deploy_kube_vip
