---


- name: Download k3s artifacts to localhost
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Download k3s binary
      get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s-arm64"
        dest: /tmp/k3s
        mode: '0755'

    - name: Download k3s install script
      get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: '0755'

    - name: Download k3s air-gap images
      get_url:
        url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s-airgap-images-arm64.tar.zst"
        dest: /tmp/k3s-airgap-images-arm64.tar.zst


- name: Copy binaries to server nodes
  hosts: server
  become: true
  roles:
    - copy_binaries

- name: Install k3s server
  hosts: server
  become: true
  serial: 1
  vars:
    k3s_cluster_init: "{{ inventory_hostname == groups['server'][0] }}"
    k3s_server_url: "{{ hostvars[groups['server'][0]]['ansible_host'] }}"
  roles:
    - k3s_server

- name: Copy and import kube-vip image on all server nodes
  hosts: server
  become: true
  tasks:
    - name: Copy kube-vip image tar to server
      ansible.builtin.copy:
        src: /tmp/k3s-images/kube-vip.tar
        dest: "/home/{{ ansible_user }}/kube-vip.tar"
        mode: '0644'

    - name: Import kube-vip image into containerd
      ansible.builtin.command: >
        k3s ctr images import /home/{{ ansible_user }}/kube-vip.tar

    - name: Copy kube-vip-cloud-provider image tar to server
      ansible.builtin.copy:
        src: /tmp/k3s-images/kube-vip-cloud-provider.tar
        dest: "/home/{{ ansible_user }}/kube-vip-cloud-provider.tar"
        mode: '0644'

    - name: Import kube-vip-cloud-provider image into containerd
      ansible.builtin.command: >
        k3s ctr --namespace k8s.io images import /home/{{ ansible_user }}/kube-vip-cloud-provider.tar

- name: Deploy kube-vip
  hosts: server
  become: true
  run_once: true
  roles:
    - deploy_kube_vip
