- name: Preflight — pull and build all container images
  hosts: localhost
  gather_facts: true
  tasks:

    - name: Check if helm binary is already staged
      ansible.builtin.stat:
        path: "/tmp/k3s-images/helm"
      register: helm_binary_staged

    - name: Download and extract Helm binary (arm64)
      ansible.builtin.unarchive:
        src: "https://get.helm.sh/helm-{{ helm_version }}-linux-arm64.tar.gz"
        dest: /tmp/k3s-images/
        remote_src: true
      environment: >-
        {{
        {'PATH': '/opt/homebrew/opt/gnu-tar/libexec/gnubin:' + ansible_env.PATH}
        if ansible_facts['os_family'] == 'Darwin'
        else {}
        }}
      when: not helm_binary_staged.stat.exists

    - name: Move helm binary to expected flat path
      ansible.builtin.copy:
        src: "/tmp/k3s-images/linux-arm64/helm"
        dest: "/tmp/k3s-images/helm"
        mode: '0755'
        remote_src: true
      when: not helm_binary_staged.stat.exists

    - name: Create image staging directory
      ansible.builtin.file:
        path: /tmp/k3s-images
        state: directory
        mode: '0755'

    - name: Check if dnsmasq tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/dnsmasq.tar"
      register: dnsmasq_tar

    - name: Check if lease-watcher tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/lease-watcher.tar"
      register: watcher_tar

    - name: Check if ansible-runner tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/ansible-runner.tar"
      register: runner_tar

    - name: Check if kube-vip tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/kube-vip.tar"
      register: kubevip_tar

    - name: Check if kube-vip-cloud-provider tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/kube-vip-cloud-provider.tar"
      register: cloud_provider_tar

    - name: Check if kube-vip DaemonSet manifest is already vendored
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../manifests/kube-vip/kube-vip-daemonset.yaml"
      register: vendored_daemonset

    - name: Check if kube-vip RBAC manifest is already vendored
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../manifests/kube-vip/kube-vip-rbac.yaml"
      register: vendored_rbac

    # Skip re-pulling/rebuilding gitea image if already staged from a previous run
    - name: Check if gitea image tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/gitea.tar"
      register: gitea_tar

    - name: Install QEMU for cross-platform builds (Linux only)
      ansible.builtin.apt:
        name:
          - qemu-user-static
          - binfmt-support
        state: present
      when: ansible_facts['os_family'] == 'Debian'
      become: true

    - name: Register QEMU binary formats
      ansible.builtin.command: update-binfmts --enable qemu-aarch64
      when: ansible_facts['os_family'] == 'Debian'
      become: true
      changed_when: false

    - name: Start Podman machine
      ansible.builtin.command: podman machine start
      failed_when: false
      changed_when: false
      when:
        - ansible_facts['os_family'] == 'Darwin'
        - not dnsmasq_tar.stat.exists or not watcher_tar.stat.exists or not runner_tar.stat.exists
          or not kubevip_tar.stat.exists or not cloud_provider_tar.stat.exists or not vendored_daemonset.stat.exists
          or not gitea_tar.stat.exists

    - name: Pull dnsmasq image for arm64
      ansible.builtin.command: >
        podman pull --platform linux/arm64 docker.io/dockurr/dnsmasq:latest
      when: not dnsmasq_tar.stat.exists

    - name: Save dnsmasq image
      ansible.builtin.command: >
        podman save dockurr/dnsmasq:latest
        -o /tmp/k3s-images/dnsmasq.tar
      when: not dnsmasq_tar.stat.exists

    - name: Build lease-watcher image for arm64
      ansible.builtin.command: >
        podman build
        --platform linux/arm64
        -t lease-watcher:latest
        {{ playbook_dir }}/../custom_images/lease-watcher/
      when: not watcher_tar.stat.exists

    - name: Save lease-watcher image
      ansible.builtin.command: >
        podman save localhost/lease-watcher:latest
        -o /tmp/k3s-images/lease-watcher.tar
      when: not watcher_tar.stat.exists

    - name: Build ansible-runner
      ansible.builtin.command: >
        podman build
        --platform linux/arm64
        -t ansible-runner:latest
        {{ playbook_dir }}/../custom_images/ansible-runner/
      when: not runner_tar.stat.exists

    - name: Save ansible-runner image
      ansible.builtin.command: >
        podman save localhost/ansible-runner:latest
        -o /tmp/k3s-images/ansible-runner.tar
      when: not runner_tar.stat.exists

    - name: Pull kube-vip image for arm64
      ansible.builtin.command: >
        podman pull --platform linux/arm64
        ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
      when: not kubevip_tar.stat.exists

    - name: Save kube-vip image
      ansible.builtin.command: >
        podman save ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
        -o /tmp/k3s-images/kube-vip.tar
      when: not kubevip_tar.stat.exists

    - name: Pull kube-vip-cloud-provider image for arm64
      ansible.builtin.command: >
        podman pull --platform linux/arm64
        ghcr.io/kube-vip/kube-vip-cloud-provider:v0.0.12
      when: not cloud_provider_tar.stat.exists

    - name: Save kube-vip-cloud-provider image
      ansible.builtin.command: >
        podman save ghcr.io/kube-vip/kube-vip-cloud-provider:v0.0.12
        -o /tmp/k3s-images/kube-vip-cloud-provider.tar
      when: not cloud_provider_tar.stat.exists

    - name: Ensure manifest files directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../manifests/kube-vip/"
        state: directory
        mode: '0755'
      when: not vendored_daemonset.stat.exists or not vendored_rbac.stat.exists

    - name: Load kube-vip image from tar (for manifest generation)
      ansible.builtin.command: >
        podman load -i /tmp/k3s-images/kube-vip.tar
      when: not vendored_daemonset.stat.exists

    - name: Generate kube-vip DaemonSet manifest (one-time — reuses already-downloaded image, no extra network)
      ansible.builtin.command: >
        podman run --rm --platform linux/arm64
        ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
        manifest daemonset
        --interface {{ kube_vip_interface }}
        --address {{ kube_vip_vip }}
        --inCluster
        --taint
        --controlplane
        --services
        --arp
        --leaderElection
      register: generated_daemonset
      when: not vendored_daemonset.stat.exists

    - name: Save generated DaemonSet manifest into the repo
      ansible.builtin.copy:
        content: "{{ generated_daemonset.stdout }}"
        dest: "{{ playbook_dir }}/../manifests/kube-vip/kube-vip-daemonset.yaml"
        mode: '0644'
      when: not vendored_daemonset.stat.exists

    - name: Fetch kube-vip RBAC manifest (one-time)
      ansible.builtin.get_url:
        url: https://kube-vip.io/manifests/rbac.yaml
        dest: "{{ playbook_dir }}/../manifests/kube-vip/kube-vip-rbac.yaml"
        mode: '0644'
      when: not vendored_rbac.stat.exists

    - name: Check if kube-vip-cloud-provider manifest is already vendored
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../manifests/kube-vip/kube-vip-cloud-controller.yaml"
      register: vendored_cloud_provider

    - name: Fetch kube-vip-cloud-provider manifest (one-time) — this is what actually assigns LoadBalancer IPs to Services
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/kube-vip/kube-vip-cloud-provider/main/manifest/kube-vip-cloud-controller.yaml
        dest: "{{ playbook_dir }}/../manifests/kube-vip/kube-vip-cloud-controller.yaml"
        mode: '0644'
      when: not vendored_cloud_provider.stat.exists

    - name: Patch kube-vip-cloud-provider manifest for airgapped compatibility (imagePullPolicy Always -> IfNotPresent)
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/../manifests/kube-vip/kube-vip-cloud-controller.yaml"
        regexp: 'imagePullPolicy: Always'
        replace: 'imagePullPolicy: IfNotPresent'

    - name: Pull gitea image for arm64
      ansible.builtin.command: >
        podman pull --platform linux/arm64
        docker.gitea.com/gitea:{{ gitea_version }}-rootless
      when: not gitea_tar.stat.exists

    - name: Save gitea image
      ansible.builtin.command: >
        podman save docker.gitea.com/gitea:{{ gitea_version }}-rootless
        -o /tmp/k3s-images/gitea.tar
      when: not gitea_tar.stat.exists

    # Helm chart is vendored into the role so cluster bootstrap works offline, without a Helm repo add
    - name: Check if gitea chart is already vendored
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../manifests/gitea/gitea/Chart.yaml"
      register: vendored_gitea_chart

    - name: Pull and unpack the Gitea Helm chart
      ansible.builtin.command: >
        helm pull oci://docker.gitea.com/charts/gitea
        --untar
        --untardir {{ playbook_dir }}/../manifests/gitea
        --version {{ gitea_chart_version }}
      when: not vendored_gitea_chart.stat.exists

    - name: Check if argocd chart is already vendored
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../manifests/argocd/argo-cd/Chart.yaml"
      register: vendored_argocd_chart

    - name: Pull and unpack the ArgoCD Helm chart
      ansible.builtin.command: >
        helm pull argo-cd
        --repo https://argoproj.github.io/argo-helm
        --version {{ argocd_chart_version }}
        --untar
        --untardir {{ playbook_dir }}/../manifests/argocd

    - name: Stop Podman machine
      ansible.builtin.command: podman machine stop
      changed_when: false
      failed_when: false
      when:
        - ansible_facts['os_family'] == 'Darwin'
        - not dnsmasq_tar.stat.exists or not watcher_tar.stat.exists or not runner_tar.stat.exists
          or not kubevip_tar.stat.exists or not cloud_provider_tar.stat.exists or not vendored_daemonset.stat.exists
          or not gitea_tar.stat.exists
