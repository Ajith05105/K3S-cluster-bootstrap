- name: Preflight — pull and build all container images
  hosts: localhost
  gather_facts: true
  tasks:

    - name: Create image staging directory
      ansible.builtin.file:
        path: /tmp/k3s-images
        state: directory
        mode: '0755'

    - name: Check if dnsmasq tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/dnsmasq.tar"
      register: dnsmasq_tar

    - name: Check if lease-watcher tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/lease-watcher.tar"
      register: watcher_tar

    - name: Check if ansible-runner tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/ansible-runner.tar"
      register: runner_tar

    - name: Check if gitea tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/gitea.tar"
      register: gitea_tar

    - name: Check if argocd tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/argocd.tar"
      register: argocd_tar

    - name: Check if redis tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/redis.tar"
      register: redis_tar

    - name: Check if dex tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/dex.tar"
      register: dex_tar

    - name: Install QEMU for cross-platform builds (Linux only)
      ansible.builtin.apt:
        name:
          - qemu-user-static
          - binfmt-support
        state: present
      when: ansible_facts['os_family'] == 'Debian'
      become: true

    - name: Register QEMU binary formats
      ansible.builtin.command: update-binfmts --enable qemu-aarch64
      when: ansible_facts['os_family'] == 'Debian'
      become: true
      changed_when: false

    - name: Start Podman machine
      ansible.builtin.command: podman machine start
      failed_when: false
      changed_when: false
      when:
        - ansible_facts['os_family'] == 'Darwin'
        - not dnsmasq_tar.stat.exists or not watcher_tar.stat.exists or not runner_tar.stat.exists

    - name: Pull dnsmasq image for arm64
      ansible.builtin.command: >
        podman pull --platform linux/arm64 docker.io/dockurr/dnsmasq:latest
      when: not dnsmasq_tar.stat.exists

    - name: Save dnsmasq image
      ansible.builtin.command: >
        podman save dockurr/dnsmasq:latest
        -o /tmp/k3s-images/dnsmasq.tar
      when: not dnsmasq_tar.stat.exists

    - name: Build lease-watcher image for arm64
      ansible.builtin.command: >
        podman build
        --platform linux/arm64
        -t lease-watcher:latest
        {{ playbook_dir }}/../custom_images/lease-watcher/
      when: not watcher_tar.stat.exists

    - name: Save lease-watcher image
      ansible.builtin.command: >
        podman save localhost/lease-watcher:latest
        -o /tmp/k3s-images/lease-watcher.tar
      when: not watcher_tar.stat.exists

    - name: Build ansible-runner
      ansible.builtin.command: >
        podman build
        --platform linux/arm64
        -t ansible-runner:latest
        {{ playbook_dir }}/../custom_images/ansible-runner/
      when: not runner_tar.stat.exists

    - name: Save ansible-runner image
      ansible.builtin.command: >
        podman save localhost/ansible-runner:latest
        -o /tmp/k3s-images/ansible-runner.tar
      when: not runner_tar.stat.exists

    - name: Pull gitea image for arm64
      ansible.builtin.command: >
        podman pull --platform linux/arm64 docker.io/gitea/gitea:latest
      when: not gitea_tar.stat.exists

    - name: Save gitea image
      ansible.builtin.command: >
        podman save docker.io/gitea/gitea:latest
        -o /tmp/k3s-images/gitea.tar
      when: not gitea_tar.stat.exists

    - name: Pull argocd image for arm64
      ansible.builtin.command: >
        podman pull --platform linux/arm64 quay.io/argoproj/argocd:v2.13.3
      when: not argocd_tar.stat.exists

    - name: Save argocd image
      ansible.builtin.command: >
        podman save quay.io/argoproj/argocd:v2.13.3
        -o /tmp/k3s-images/argocd.tar
      when: not argocd_tar.stat.exists

    - name: Pull redis image for arm64
      ansible.builtin.command: >
        podman pull --platform linux/arm64 public.ecr.aws/docker/library/redis:7.0.15-alpine
      when: not redis_tar.stat.exists

    - name: Save redis image
      ansible.builtin.command: >
        podman save public.ecr.aws/docker/library/redis:7.0.15-alpine
        -o /tmp/k3s-images/redis.tar
      when: not redis_tar.stat.exists

    - name: Pull dex image for arm64
      ansible.builtin.command: >
        podman pull --platform linux/arm64 ghcr.io/dexidp/dex:v2.41.1
      when: not dex_tar.stat.exists

    - name: Save dex image
      ansible.builtin.command: >
        podman save ghcr.io/dexidp/dex:v2.41.1
        -o /tmp/k3s-images/dex.tar
      when: not dex_tar.stat.exists

    - name: Download ArgoCD install manifest
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/v2.13.3/manifests/install.yaml
        dest: /tmp/k3s-images/argocd-install.yaml
        mode: '0644'

    - name: Stop Podman machine
      ansible.builtin.command: podman machine stop
      changed_when: false
      failed_when: false
      when:
        - ansible_facts['os_family'] == 'Darwin'
        - not dnsmasq_tar.stat.exists or not watcher_tar.stat.exists or not runner_tar.stat.exists
