- name: Preflight — pull and build all container images
  hosts: localhost
  gather_facts: true
  tasks:

    - name: Create image staging directory
      ansible.builtin.file:
        path: /tmp/k3s-images
        state: directory
        mode: '0755'

    - name: Check if dnsmasq tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/dnsmasq.tar"
      register: dnsmasq_tar

    - name: Check if lease-watcher tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/lease-watcher.tar"
      register: watcher_tar

    - name: Check if ansible-runner tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/ansible-runner.tar"
      register: runner_tar

    - name: Install QEMU for cross-platform builds (Linux only)
      ansible.builtin.apt:
        name:
          - qemu-user-static
          - binfmt-support
        state: present
      when: ansible_facts['os_family'] == 'Debian'
      become: true

    - name: Register QEMU binary formats
      ansible.builtin.command: update-binfmts --enable qemu-aarch64
      when: ansible_facts['os_family'] == 'Debian'
      become: true
      changed_when: false

    - name: Start Podman machine
      ansible.builtin.command: podman machine start
      failed_when: false 
      changed_when: false
      when:
        - ansible_facts['os_family'] == 'Darwin'
        - not dnsmasq_tar.stat.exists or not watcher_tar.stat.exists or not runner_tar.stat.exists

    - name: Pull dnsmasq image for arm64
      ansible.builtin.command: >
        podman pull --platform linux/arm64 docker.io/dockurr/dnsmasq:latest
      when: not dnsmasq_tar.stat.exists

    - name: Save dnsmasq image
      ansible.builtin.command: >
        podman save dockurr/dnsmasq:latest
        -o /tmp/k3s-images/dnsmasq.tar
      when: not dnsmasq_tar.stat.exists

    - name: Build lease-watcher image for arm64
      ansible.builtin.command: >
        podman build
        --platform linux/arm64
        -t lease-watcher:latest
        {{ playbook_dir }}/../custom_images/lease-watcher/
      when: not watcher_tar.stat.exists

    - name: Save lease-watcher image
      ansible.builtin.command: >
        podman save localhost/lease-watcher:latest
        -o /tmp/k3s-images/lease-watcher.tar
      when: not watcher_tar.stat.exists

    - name: Build ansible-runner
      ansible.builtin.command: >
        podman build
        --platform linux/arm64
        -t ansible-runner:latest
        {{ playbook_dir }}/../custom_images/ansible-runner/
      when: not runner_tar.stat.exists

    - name: Save ansible-runner image
      ansible.builtin.command: >
        podman save localhost/ansible-runner:latest
        -o /tmp/k3s-images/ansible-runner.tar
      when: not runner_tar.stat.exists
    
    - name: Check if kube-vip tar exists
      ansible.builtin.stat:
        path: "/tmp/k3s-images/kube-vip.tar"
      register: kubevip_tar

    - name: Pull kube-vip image for arm64
      ansible.builtin.command: >
        podman pull --platform linux/arm64
        ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
      when: not kubevip_tar.stat.exists
    
    - name: Save kube-vip image
      ansible.builtin.command: >
        podman save ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
        -o /tmp/k3s-images/kube-vip.tar
      when: not kubevip_tar.stat.exists

    - name: Check if kube-vip DaemonSet manifest is already vendored
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../roles/deploy_kube_vip/files/kube-vip-daemonset.yaml"
      register: vendored_daemonset

    - name: Check if kube-vip RBAC manifest is already vendored
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../roles/deploy_kube_vip/files/kube-vip-rbac.yaml"
      register: vendored_rbac

    - name: Ensure deploy_kube_vip files directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../roles/deploy_kube_vip/files"
        state: directory
        mode: '0755'
      when: not vendored_daemonset.stat.exists or not vendored_rbac.stat.exists

    - name: Load kube-vip image from tar (for manifest generation)
      ansible.builtin.command: >
        podman load -i /tmp/k3s-images/kube-vip.tar
      when: not vendored_daemonset.stat.exists

    - name: Generate kube-vip DaemonSet manifest (one-time — reuses already-downloaded image, no extra network)
      ansible.builtin.command: >
        podman run --rm --platform linux/arm64
        ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
        manifest daemonset
        --interface {{ kube_vip_interface }}
        --address {{ kube_vip_vip }}
        --inCluster
        --taint
        --controlplane
        --services
        --arp
        --leaderElection
      register: generated_daemonset
      when: not vendored_daemonset.stat.exists

    - name: Save generated DaemonSet manifest into the repo
      ansible.builtin.copy:
        content: "{{ generated_daemonset.stdout }}"
        dest: "{{ playbook_dir }}/../roles/deploy_kube_vip/files/kube-vip-daemonset.yaml"
        mode: '0644'
      when: not vendored_daemonset.stat.exists

    - name: Fetch kube-vip RBAC manifest (one-time)
      ansible.builtin.get_url:
        url: https://kube-vip.io/manifests/rbac.yaml
        dest: "{{ playbook_dir }}/../roles/deploy_kube_vip/files/kube-vip-rbac.yaml"
        mode: '0644'
      when: not vendored_rbac.stat.exists

    - name: Stop Podman machine
      ansible.builtin.command: podman machine stop
      changed_when: false
      failed_when: false
      when:
        - ansible_facts['os_family'] == 'Darwin'
        - not dnsmasq_tar.stat.exists or not watcher_tar.stat.exists or not runner_tar.stat.exists
