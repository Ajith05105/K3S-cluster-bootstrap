---
- name: Preflight checks
  hosts: all
  become: true
  tasks:
    - name: Check if k3s binary exists
      stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Check k3s version
      command: k3s --version
      register: k3s_version
      when: k3s_binary.stat.exists
      changed_when: false

    - name: Print k3s status
      debug:
        msg: "{{ inventory_hostname }}: k3s {{ 'installed - ' + k3s_version.stdout if k3s_binary.stat.exists else 'NOT installed' }}"

    - name: Check k3s server service
      systemd:
        name: k3s
      register: k3s_server
      when: inventory_hostname in groups['server']
      ignore_errors: true

    - name: Check k3s agent service
      systemd:
        name: k3s-agent
      register: k3s_agent
      when: inventory_hostname in groups['workers']
      ignore_errors: true

    - name: Print k3s server service status
      debug:
        msg: "{{ inventory_hostname }}: k3s server is {{ k3s_server.status.ActiveState }}"
      when: inventory_hostname in groups['server'] and k3s_server.status is defined

    - name: Print k3s agent service status
      debug:
        msg: "{{ inventory_hostname }}: k3s agent is {{ k3s_agent.status.ActiveState }}"
      when: inventory_hostname in groups['workers'] and k3s_agent.status is defined