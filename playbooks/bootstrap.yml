---
- name: Download k3s artifacts to localhost
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Download k3s binary
      get_url:
        url: https://github.com/k3s-io/k3s/releases/latest/download/k3s-arm64
        dest: /tmp/k3s
        mode: '0755'

    - name: Download k3s install script
      get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: '0755'

- name: Prepare all nodes
  hosts: all
  become: true
  tasks:
    - name: Sync time from bootstrap laptop
      shell: |
        timedatectl set-ntp false
        sleep 2
        timedatectl set-time "{{ ansible_facts['date_time']['date'] }} {{ ansible_facts['date_time']['time'] }}"
      become: true
      ignore_errors: true

    - name: Copy k3s binary to node
      copy:
        src: /tmp/k3s
        dest: /usr/local/bin/k3s
        mode: '0755'

    - name: Copy k3s install script to node
      copy:
        src: /tmp/k3s-install.sh
        dest: /home/{{ ansible_user }}/k3s-install.sh
        mode: '0755'

- name: Install k3s server
  hosts: server
  become: true
  tasks:
    - name: Check if k3s server is already installed
      stat:
        path: /etc/systemd/system/k3s.service
      register: k3s_service

    - name: Install k3s server
      shell: |
        INSTALL_K3S_SKIP_DOWNLOAD=true K3S_TOKEN=mysecrettoken \
        /home/{{ ansible_user }}/k3s-install.sh server --cluster-init
      when: not k3s_service.stat.exists

    - name: Wait for k3s to be ready
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 60

    - name: Get node token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token

    - name: Set token fact
      set_fact:
        k3s_token: "{{ node_token.content | b64decode | trim }}"

    - name: Wait for all nodes to be ready
      shell: kubectl get nodes
      register: nodes_output
      become: true
      retries: 10
      delay: 15
      until: nodes_output.rc == 0
      changed_when: false

- name: Install k3s agents
  hosts: workers
  become: true
  tasks:
    - name: Check if k3s agent is already installed
      stat:
        path: /etc/systemd/system/k3s-agent.service
      register: k3s_agent_service

    - name: Install k3s agent
      shell: |
        INSTALL_K3S_SKIP_DOWNLOAD=true \
        K3S_TOKEN={{ hostvars[groups['server'][0]]['k3s_token'] }} \
        K3S_URL=https://192.168.1.200:6443 \
        /home/{{ ansible_user }}/k3s-install.sh agent
      when: not k3s_agent_service.stat.exists