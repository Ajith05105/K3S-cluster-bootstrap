---
- name: "{{ this_tenant }}: check if already onboarded"
  ansible.builtin.command: >
    kubectl get secret tenant-{{ this_tenant }}-app-repo -n argocd -o jsonpath='{.data.password}'
  register: existing_secret_check
  changed_when: false
  failed_when: false

- name: "{{ this_tenant }}: generate a new random password"
  ansible.builtin.set_fact:
    tenant_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
  when: existing_secret_check.rc != 0

- name: "{{ this_tenant }}: reuse existing password"
  ansible.builtin.set_fact:
    tenant_password: "{{ existing_secret_check.stdout | b64decode }}"
  when: existing_secret_check.rc == 0

- name: "{{ this_tenant }}: check if Gitea account exists"
  ansible.builtin.uri:
    url: "http://{{ gitea_cluster_ip.stdout }}:3000/api/v1/users/{{ this_tenant }}"
    method: GET
    user: "{{ gitea_admin_username }}"
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: tenant_user_check
  no_log: true

- name: "{{ this_tenant }}: create Gitea account"
  ansible.builtin.uri:
    url: "http://{{ gitea_cluster_ip.stdout }}:3000/api/v1/admin/users"
    method: POST
    user: "{{ gitea_admin_username }}"
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      username: "{{ this_tenant }}"
      email: "{{ this_tenant }}@cluster.local"
      password: "{{ tenant_password }}"
      must_change_password: false
    status_code: [201]
  when: tenant_user_check.status == 404
  no_log: true

- name: "{{ this_tenant }}: check if app repo exists"
  ansible.builtin.uri:
    url: "http://{{ gitea_cluster_ip.stdout }}:3000/api/v1/repos/{{ this_tenant }}/app"
    method: GET
    user: "{{ gitea_admin_username }}"
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: tenant_repo_check
  no_log: true

- name: "{{ this_tenant }}: create app repo"
  ansible.builtin.uri:
    url: "http://{{ gitea_cluster_ip.stdout }}:3000/api/v1/admin/users/{{ this_tenant }}/repos"
    method: POST
    user: "{{ gitea_admin_username }}"
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: app
      private: true
      auto_init: true
    status_code: [201]
  when: tenant_repo_check.status == 404
  no_log: true

- name: "{{ this_tenant }}: generate ArgoCD repository Secret"
  ansible.builtin.copy:
    dest: "/home/{{ ansible_user }}/tenant-{{ this_tenant }}-repo-secret.yaml"
    mode: '0600'
    content: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: tenant-{{ this_tenant }}-app-repo
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: "http://gitea-http.gitea.svc.cluster.local:3000/{{ this_tenant }}/app.git"
        username: "{{ this_tenant }}"
        password: "{{ tenant_password }}"
  no_log: true

- name: "{{ this_tenant }}: apply ArgoCD repository Secret"
  ansible.builtin.command: kubectl apply -f /home/{{ ansible_user }}/tenant-{{ this_tenant }}-repo-secret.yaml
  changed_when: true

- name: "{{ this_tenant }}: remove staged secret file"
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/tenant-{{ this_tenant }}-repo-secret.yaml"
    state: absent


- name: "{{ this_tenant }}: prepare starter chart locally"
  ansible.builtin.shell: |
    set -e
    rm -rf /tmp/starter-{{ this_tenant }}
    cp -r /home/{{ ansible_user }}/cluster-config-push/tenant-onboarding-kit /tmp/starter-{{ this_tenant }}
    sed -i "s#TENANT_NAME_PLACEHOLDER#{{ this_tenant }}#" /tmp/starter-{{ this_tenant }}/values.yaml
    cd /tmp/starter-{{ this_tenant }}
    git init -q -b main
    git config user.email {{ this_tenant }}@cluster.local
    git config user.name {{ this_tenant }}
    git add -A
    git commit -q -m "starter chart"
  when: tenant_repo_check.status == 404
  changed_when: true

- name: "{{ this_tenant }}: push starter chart to their new repo"
  ansible.builtin.shell: |
    cd /tmp/starter-{{ this_tenant }}
    git push -q -f http://{{ this_tenant }}:{{ tenant_password }}@{{ gitea_cluster_ip.stdout }}:3000/{{ this_tenant }}/app.git main
  when: tenant_repo_check.status == 404
  no_log: true
  changed_when: true

- name: "{{ this_tenant }}: wait for their namespace to exist (created async by ArgoCD)"
  ansible.builtin.command: kubectl get namespace {{ this_tenant }}
  register: namespace_check
  until: namespace_check.rc == 0
  retries: 40
  delay: 15
  changed_when: false

- name: "{{ this_tenant }}: create their own registry-pull secret"
  ansible.builtin.shell: |
    kubectl create secret docker-registry registry-pull \
      --docker-server=gitea.cluster.local:3000 \
      --docker-username={{ this_tenant }} \
      --docker-password={{ tenant_password }} \
      -n {{ this_tenant }} --dry-run=client -o yaml | kubectl apply -f -
  register: pull_secret_result
  until: pull_secret_result.rc == 0
  retries: 3
  delay: 5
  no_log: true
  changed_when: true

# --- Everything below is NEW tonight -----------------------------------
#
# Both tasks run unconditionally (no `when: tenant_repo_check.status == 404`)
# so that re-running sync_tenants.yml also backfills the tenants that were
# already onboarded before tonight (ajith, alice, demo, emilio, isaac,
# verify, william) — not just tenants created from here on.

- name: "{{ this_tenant }}: register their Gitea password as an Actions secret on their repo"
  ansible.builtin.uri:
    url: "http://{{ gitea_cluster_ip.stdout }}:3000/api/v1/repos/{{ this_tenant }}/app/actions/secrets/REGISTRY_PASSWORD"
    method: PUT
    user: "{{ gitea_admin_username }}"
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      data: "{{ tenant_password }}"
    status_code: [201, 204]
  no_log: true
  # This is what lets build-and-deploy.yaml (shipped via the starter kit)
  # authenticate as the tenant to push to their own registry namespace and
  # git-push its own tag-bump commit — reusing the same account/password
  # onboarding already generates rather than minting yet another credential.
  # A PUT is create-or-update, so this is safe to run on every sync.
  #
  # If this 404s, or the workflow can't use REGISTRY_PASSWORD at job time:
  # Gitea's own API docs for this endpoint are inconsistent about whether
  # `data` wants the raw value or a base64-encoded one, and it wasn't
  # practical to verify against a live 1.26.4 instance ahead of time. Try
  # raw first (this task assumes raw); if the workflow's buildah login fails
  # with a garbled-looking credential, base64-encode tenant_password before
  # sending it instead.

- name: "{{ this_tenant }}: check if their repo already has the CI workflow"
  ansible.builtin.uri:
    url: "http://{{ gitea_cluster_ip.stdout }}:3000/api/v1/repos/{{ this_tenant }}/app/contents/.gitea/workflows/build-and-deploy.yaml"
    method: GET
    user: "{{ gitea_admin_username }}"
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: tenant_workflow_check
  no_log: true

- name: "{{ this_tenant }}: push the CI workflow to their repo"
  ansible.builtin.uri:
    url: "http://{{ gitea_cluster_ip.stdout }}:3000/api/v1/repos/{{ this_tenant }}/app/contents/.gitea/workflows/build-and-deploy.yaml"
    method: POST
    user: "{{ gitea_admin_username }}"
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      message: "ci: add build-and-deploy workflow"
      branch: main
      content: "{{ lookup('ansible.builtin.file', role_path + '/../../manifests/tenant-onboarding-kit/templates/.gitea/workflows/build-and-deploy.yaml') | b64encode }}"
    status_code: [201]
  when: tenant_workflow_check.status == 404
  no_log: true
  # Only fires when the file is genuinely missing (brand-new tenants already
  # got it via the starter-chart push above, so this is a no-op for them —
  # it's specifically the backfill path for the six tenants that predate
  # this file existing). Deliberately never overwrites: if a tenant has
  # since edited their own workflow, this leaves it alone.
