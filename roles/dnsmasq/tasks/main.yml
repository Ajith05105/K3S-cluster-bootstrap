---
- name: Load OS-specific variables
  include_vars: "{{ ansible_system }}.yml"

- name: Configure dnsmasq on bootstrap laptop
  template:
    src: dnsmasq.conf.j2
    dest: "{{ dnsmasq_conf_path }}"
  become: true

- name: Check if dnsmasq is already running
  command: pgrep dnsmasq
  register: dnsmasq_running
  changed_when: false
  failed_when: false

- name: Start dnsmasq on bootstrap laptop
  shell: "{{ dnsmasq_bin }} -C {{ dnsmasq_conf_path }}"
  become: true
  when: dnsmasq_running.rc != 0

- name: Wait for dnsmasq to start
  command: pgrep dnsmasq
  register: dnsmasq_pid
  retries: 5
  delay: 2
  until: dnsmasq_pid.rc == 0

- name: Stop dnsmasq after bootstrap
  shell: "{{ dnsmasq_stop_cmd }}"
  become: true
  when: stop_dnsmasq | default(false)
