---
- name: Create argocd namespace
  ansible.builtin.command: kubectl create namespace argocd
  register: ns_result
  failed_when: ns_result.rc != 0 and 'already exists' not in ns_result.stderr
  changed_when: ns_result.rc == 0

- name: Create manifests staging directory on server
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/manifests/argocd
    state: directory
    mode: '0755'

- name: Copy argocd kustomize directory to server
  ansible.builtin.copy:
    src: "{{ role_path }}/../../manifests/argocd/"
    dest: "/home/{{ ansible_user }}/manifests/argocd/"
    mode: '0644'
    directory_mode: '0755'

- name: Deploy argocd via kustomize
  ansible.builtin.command: >
    kubectl apply -k /home/{{ ansible_user }}/manifests/argocd/overlay/

- name: Wait for argocd-server to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=available
    deployment/argocd-server -n argocd
    --timeout=300s
  changed_when: false
  