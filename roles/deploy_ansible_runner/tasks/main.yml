---
- name: Check if ansible-runner key secret exists
  ansible.builtin.command: >
    kubectl get secret ansible-runner-key
    -n kube-system
    --ignore-not-found
  register: secret_check
  changed_when: false
  failed_when: false

- name: Copy ansible-runner private key to server
  ansible.builtin.copy:
    src: "{{ ansible_runner_private_key }}"
    dest: /tmp/ansible_runner_key
    mode: '0600'
  when: secret_check.stdout == ""

- name: Create ansible-runner SSH key secret
  ansible.builtin.command: >
    kubectl create secret generic ansible-runner-key
    --namespace kube-system
    --from-file=private-key=/tmp/ansible_runner_key
  when: secret_check.stdout == ""

- name: Remove key from server
  ansible.builtin.file:
    path: /tmp/ansible_runner_key
    state: absent

- name: Copy ansible-runner serviceaccount manifest
  ansible.builtin.copy:
    src: "{{ role_path }}/../../manifests/ansible-runner/serviceaccount.yml"
    dest: /tmp/k8s_manifests/ansible-runner-serviceaccount.yml
  register: runner_sa_manifest

- name: Apply ansible-runner serviceaccount and RBAC
  ansible.builtin.command: kubectl apply -f /tmp/k8s_manifests/ansible-runner-serviceaccount.yml
  when: runner_sa_manifest.changed

# The Deployment itself is deliberately NOT applied here. It lives in
# manifests/ansible-runner/deployment.yml, which bootstrap_gitops syncs into
# cluster-config, and ArgoCD (platform-ansible-runner) reconciles it with
# prune+selfHeal. Applying it from Ansible as well meant two controllers
# owning one object: Ansible would set the env block, ArgoCD would revert it
# within seconds. This role now only provisions what ArgoCD cannot — the SSH
# key Secret, which must never be committed to Git.
#
# Bootstrap ordering note: on a first run the Deployment appears only once
# ArgoCD has synced cluster-config, so it is not ready when this role ends.
- name: Wait for ansible-runner pod to be ready (once ArgoCD has created it)
  ansible.builtin.command: >
    kubectl wait --for=condition=available
    deployment/ansible-runner -n kube-system
    --timeout=120s
  changed_when: false
  failed_when: false
