---
- name: Fix cloud-init hostname preservation
  lineinfile:
    path: "{{ cloud_cfg_path }}"
    regexp: '^preserve_hostname'
    line: 'preserve_hostname: true'

- name: Read cmdline.txt
  slurp:
    src: "{{ cmdline_path }}"
  register: cmdline_raw

- name: Enable cgroups in cmdline.txt
  lineinfile:
    path: "{{ cmdline_path }}"
    backrefs: true
    regexp: '^(.+)$'
    line: '\1 cgroup_enable=memory cgroup_memory=1'
  when: "'cgroup_memory=1' not in (cmdline_raw.content | b64decode)"
  notify: Reboot node
