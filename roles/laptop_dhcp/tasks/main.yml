- name: Gather facts
  setup:
    gather_subset:
      - '!all'
      - '!min'
      - system

- name: Load platform variables
  include_vars: "{{ ansible_facts['os_family'] | lower }}.yml"

- name: Install dnsmasq
  package:
    name: dnsmasq
    state: present
  become: false

- name: Write dnsmasq config
  template:
    src: dnsmasq.conf.j2
    dest: "{{ dnsmasq_conf_path }}"
  notify: restart dnsmasq

- name: Check if dnsmasq is running
  command: pgrep dnsmasq
  register: dnsmasq_running
  changed_when: false
  failed_when: false

- name: Start dnsmasq
  command: "{{ dnsmasq_start_cmd }}"
  when: dnsmasq_running.rc != 0

- name: Wait for dnsmasq to be ready
  wait_for:
    path: /tmp/dnsmasq.leases
    timeout: 10
  ignore_errors: true
