---
- name: Copy kube-vip image tar to server
  ansible.builtin.copy:
    src: /tmp/k3s-images/kube-vip.tar
    dest: "/home/{{ ansible_user }}/kube-vip.tar"
    mode: '0644'

- name: Copy kube-vip RBAC manifest to server
  ansible.builtin.copy:
    src: /tmp/k3s-images/kube-vip-rbac.yaml
    dest: "/home/{{ ansible_user }}/kube-vip-rbac.yaml"
    mode: '0644'

- name: Create K3s manifests directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    mode: '0755'

- name: Place kube-vip RBAC manifest in K3s auto-deploy directory
  ansible.builtin.copy:
    src: "/home/{{ ansible_user }}/kube-vip-rbac.yaml"
    dest: /var/lib/rancher/k3s/server/manifests/kube-vip-rbac.yaml
    mode: '0644'
    remote_src: true

- name: Import kube-vip image into containerd k8s.io namespace
  ansible.builtin.command: >
    k3s ctr --address /run/k3s/containerd/containerd.sock
    --namespace k8s.io
    images import /home/{{ ansible_user }}/kube-vip.tar

- name: Generate kube-vip DaemonSet manifest
  ansible.builtin.shell: >
    k3s ctr run --rm --net-host
    ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
    vip /kube-vip manifest daemonset
    --interface {{ kube_vip_interface }}
    --address {{ kube_vip_vip }}
    --inCluster
    --taint
    --controlplane
    --services
    --arp
    --leaderElection
  register: kube_vip_manifest

- name: Place kube-vip DaemonSet manifest in K3s auto-deploy directory
  ansible.builtin.copy:
    content: "{{ kube_vip_manifest.stdout }}"
    dest: /var/lib/rancher/k3s/server/manifests/kube-vip.yaml
    mode: '0644'

- name: Wait for kube-vip DaemonSet resource to exist
  ansible.builtin.command: >
    kubectl get daemonset kube-vip-ds -n kube-system
  become: true
  register: kube_vip_ds_check
  until: kube_vip_ds_check.rc == 0
  retries: 15
  delay: 2
  changed_when: false

- name: Wait for kube-vip DaemonSet pods to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=ready pod
    -n kube-system
    -l app.kubernetes.io/name=kube-vip-ds
    --timeout=120s
  become: true
  changed_when: false
  ignore_errors: true