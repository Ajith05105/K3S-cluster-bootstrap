---
- name: Copy kube-vip image tar to server
  ansible.builtin.copy:
    src: /tmp/k3s-images/kube-vip.tar
    dest: "/home/{{ ansible_user }}/kube-vip.tar"
    mode: '0644'

- name: Ensure K3s manifests directory exists
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    mode: '0755'

- name: Copy kube-vip RBAC manifest to K3s auto-deploy directory
  ansible.builtin.copy:
    src: kube-vip-rbac.yaml
    dest: /var/lib/rancher/k3s/server/manifests/kube-vip-rbac.yaml
    mode: '0644'

- name: Import kube-vip image into containerd k8s.io namespace
  ansible.builtin.command: >
    k3s ctr --address /run/k3s/containerd/containerd.sock
    --namespace k8s.io
    images import /home/{{ ansible_user }}/kube-vip.tar

- name: Copy kube-vip DaemonSet manifest to K3s auto-deploy directory
  ansible.builtin.copy:
    src: kube-vip-daemonset.yaml
    dest: /var/lib/rancher/k3s/server/manifests/kube-vip.yaml
    mode: '0644'

- name: Wait for kube-vip DaemonSet resource to exist
  ansible.builtin.command: >
    kubectl get daemonset kube-vip-ds -n kube-system
  become: true
  register: kube_vip_ds_check
  until: kube_vip_ds_check.rc == 0
  retries: 15
  delay: 2
  changed_when: false

- name: Wait for kube-vip DaemonSet pods to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=ready pod
    -n kube-system
    -l app.kubernetes.io/name=kube-vip-ds
    --timeout=120s
  become: true
  changed_when: false
  ignore_errors: true

# --- LoadBalancer support for Services (e.g. Traefik) ---
# kube-vip's DaemonSet above only handles the control-plane VIP. Actually
# watching Service objects of type LoadBalancer and assigning them an IP
# is a separate component, kube-vip-cloud-provider. Since --disable servicelb
# turns off k3s's own built-in LB controller, without this, every
# LoadBalancer Service sits at EXTERNAL-IP <pending> forever.

- name: Copy kube-vip-cloud-provider manifest to K3s auto-deploy directory
  ansible.builtin.copy:
    src: kube-vip-cloud-controller.yaml
    dest: /var/lib/rancher/k3s/server/manifests/kube-vip-cloud-controller.yaml
    mode: '0644'

- name: Generate and place kube-vip LoadBalancer IP range ConfigMap
  ansible.builtin.template:
    src: kubevip-range-configmap.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/kubevip-range-configmap.yaml
    mode: '0644'

- name: Wait for kube-vip-cloud-provider deployment to exist
  ansible.builtin.command: >
    kubectl get deployment kube-vip-cloud-provider -n kube-system
  become: true
  register: cloud_provider_deploy_check
  until: cloud_provider_deploy_check.rc == 0
  retries: 15
  delay: 2
  changed_when: false

- name: Wait for kube-vip-cloud-provider to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=available
    deployment/kube-vip-cloud-provider -n kube-system
    --timeout=120s
  become: true
  changed_when: false
  ignore_errors: true
