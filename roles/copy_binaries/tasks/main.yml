---
- name: Copy k3s binary
  copy:
    src: "{{ k3s_local_binary }}"
    dest: "{{ k3s_binary_dest }}"
    mode: '0755'

- name: Copy k3s install script
  copy:
    src: "{{ k3s_local_install_script }}"
    dest: "{{ k3s_install_script_dest }}"
    mode: '0755'

- name: Ensure k3s images directory exists
  file:
    path: "{{ k3s_airgap_images_dir }}"
    state: directory
    mode: '0755'

- name: Copy k3s air-gap images
  copy:
    src: "{{ k3s_local_airgap_bundle }}"
    dest: "{{ k3s_airgap_images_dir }}/k3s-airgap-images-arm64.tar.zst"
    mode: '0644'
