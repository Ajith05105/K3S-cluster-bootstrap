---
- name: Create local manifest directory
  ansible.builtin.file:
    path: /tmp/k8s_manifests
    state: directory
    mode: '0700'

- name: Get Traefik's current LoadBalancer IP
  ansible.builtin.command: >
    kubectl get svc traefik -n kube-system
    -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  register: traefik_lb_ip_fact
  changed_when: false

- name: Generate dnsmasq config manifest
  ansible.builtin.template:
    src: dnsmasq-config.yaml.j2
    dest: /tmp/k8s_manifests/dnsmasq-config.yaml
    mode: '0600'
  register: dnsmasq_manifest
  vars:
    traefik_lb_ip: "{{ traefik_lb_ip_fact.stdout }}"

- name: Apply dnsmasq config ConfigMap
  ansible.builtin.command: kubectl apply -f /tmp/k8s_manifests/dnsmasq-config.yaml
  when: dnsmasq_manifest.changed

# Bridges per-site values from all.yml into the cluster for workloads ArgoCD
# owns. Must be applied before anything consumes it — ansible-runner's
# Deployment reads two keys from here via configMapKeyRef and will not start
# without them.
- name: Generate site config manifest
  ansible.builtin.template:
    src: site-config.yaml.j2
    dest: /tmp/k8s_manifests/site-config.yaml
    mode: '0600'
  register: site_config_manifest

- name: Apply site config ConfigMap
  ansible.builtin.command: kubectl apply -f /tmp/k8s_manifests/site-config.yaml
  when: site_config_manifest.changed

- name: Generate control plane registry manifest
  ansible.builtin.template:
    src: control-plane-registry.yaml.j2
    dest: /tmp/k8s_manifests/control-plane-registry.yaml
    mode: '0600'
  register: cp_registry_manifest

- name: Apply control plane registry ConfigMap
  ansible.builtin.command: kubectl apply -f /tmp/k8s_manifests/control-plane-registry.yaml
  when: cp_registry_manifest.changed

- name: Check if worker registry exists
  ansible.builtin.command: >
    kubectl get configmap worker-registry
    -n kube-system
    --ignore-not-found
  register: worker_registry_check
  changed_when: false
  failed_when: false

- name: Create worker registry first time only
  ansible.builtin.command: >
    kubectl create configmap worker-registry
    --namespace kube-system
    --from-literal=workers=""
  when: worker_registry_check.stdout == ""
